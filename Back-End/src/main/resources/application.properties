spring.application.name=dev-suivi
# URL JDBC avec le paramètre currentSchema
spring.datasource.url=jdbc:postgresql://localhost:5432/dev_suivi

spring.datasource.username=postgres
spring.datasource.password=postgres

# Pilote PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Indiquer à Hibernate quel schéma utiliser par défaut
spring.jpa.properties.hibernate.default_schema=public

# (Optionnel) Stratégie d'auto-création / mise à jour
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#spring.security.user.name=userName
#spring.security.user.password=userPassword

jwt.secret=un texte secret suffisamment long
#jwt.expiration=600
jwt.expiration=86400
jwt.refresh.expiration=86400

springdoc.swagger-ui.persistAuthorization=true